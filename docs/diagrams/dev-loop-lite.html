<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dev-loop-lite</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --color-paper:   #f5f5f5;
    --color-ink:     #2d3142;
    --color-muted:   #4f5d75;
    --color-accent:  #eb6c36;
    --font-sans:     'Geist', system-ui, sans-serif;
    --font-serif:    'Instrument Serif', serif;
    --font-mono:     'Geist Mono', ui-monospace, monospace;
  }
  body {
    font-family: var(--font-sans);
    background: var(--color-paper);
    color: var(--color-ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3rem 2rem;
  }
  .frame { max-width: 1280px; width: 100%; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 0.66rem;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: 0.5rem;
  }
  h1 {
    font-family: var(--font-serif);
    font-size: 1.75rem;
    font-weight: 400;
    letter-spacing: -0.02em;
    line-height: 1.15;
    color: var(--color-ink);
    margin-bottom: 1.25rem;
  }
  svg { width: 100%; min-width: 900px; display: block; }
  svg text { font-family: var(--font-sans); }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Development loop &middot; lite &middot; Diagram Design</p>
  <h1>dev-loop-lite &mdash; nine concerns compressed into four lanes</h1>

  <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dev-loop-lite-title dev-loop-lite-desc">
    <title id="dev-loop-lite-title">dev-loop-lite: four consolidated review lanes across two rounds</title>
    <desc id="dev-loop-lite-desc">Swimlane diagram of dev-loop-lite across Lead, Implementation, Review, and Verify &amp; Ship lanes: the full loop's nine review concerns compressed into four consolidated lanes with their model tiers, two review rounds, and escalation to the full dev-loop on a round-1 Critical.</desc>
    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
    </defs>

    <style>
      .lane-div   { stroke: rgba(45,49,66,0.14); stroke-width: 0.8; }
      .lane-lbl   { font: 500 8px 'Geist Mono'; letter-spacing: 0.14em; text-transform: uppercase; fill: #4f5d75; }
      .zone-lbl   { font: 500 7px 'Geist Mono'; letter-spacing: 0.10em; text-transform: uppercase; fill: #7a8399; }
      .box        { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
      .chip       { fill: #ffffff; stroke: #2d3142; stroke-width: 0.8; }
      .zone       { fill: #ececec; stroke-width: 1; }
      .zone-focal { stroke: #eb6c36; }
      .ext        { fill: rgba(45,49,66,0.03); stroke: rgba(45,49,66,0.32); stroke-width: 1; stroke-dasharray: 4,3; }
      .tag-focal  { fill: transparent; stroke: #eb6c36; stroke-width: 0.8; }
      .tag-focal-t{ font: 500 6.5px 'Geist Mono'; letter-spacing: 0.04em; fill: #eb6c36; }
      .name       { font: 600 12px 'Geist'; fill: #2d3142; }
      .name-sm    { font: 600 11px 'Geist'; fill: #2d3142; }
      .sub        { font: 400 9px 'Geist Mono'; fill: #4f5d75; }
      .merge      { font: 400 7px 'Geist Mono'; fill: #4f5d75; }
      .gate       { font: 400 7px 'Geist Mono'; fill: #7a8399; }
      .gate-ext   { font: 400 7px 'Geist Mono'; fill: #7a8399; }
      .arrow-lbl  { font: 500 8px 'Geist Mono'; letter-spacing: 0.06em; fill: #4f5d75; text-anchor: middle; }
      .caption    { font: 400 7px 'Geist Mono'; fill: #7a8399; }
      .legend-t   { font: 400 8px 'Geist Mono'; letter-spacing: 0.05em; fill: #4f5d75; }
    </style>

    <rect width="100%" height="100%" fill="#f5f5f5"/>

    <!-- ===== lane dividers ===== -->
    <g class="lane-div">
      <line x1="40" y1="40"  x2="1240" y2="40"/>
      <line x1="40" y1="128" x2="1240" y2="128"/>
      <line x1="40" y1="216" x2="1240" y2="216"/>
      <line x1="40" y1="488" x2="1240" y2="488"/>
      <line x1="40" y1="648" x2="1240" y2="648"/>
    </g>
    <g class="lane-lbl">
      <text x="64" y="54">LEAD</text>
      <text x="64" y="142">IMPLEMENTATION</text>
      <text x="64" y="230">REVIEW &middot; 4 LANES</text>
      <text x="64" y="502">VERIFY &amp; SHIP</text>
    </g>
    <rect class="tag-focal" x="196" y="221" width="40" height="12" rx="2"/>
    <text class="tag-focal-t" x="216" y="229.5" text-anchor="middle">9 &rarr; 4</text>
    <g class="caption">
      <text x="64" y="248">4 fit one batch &mdash; no waves</text>
    </g>

    <!-- ===== zone (single consolidated review batch) ===== -->
    <rect class="zone zone-focal" x="540" y="228" width="300" height="248" rx="8"/>
    <text class="zone-lbl" x="548" y="242">ALL 4 &middot; ONE BATCH, PARALLEL</text>

    <!-- ===== arrows (drawn before nodes) ===== -->
    <g fill="none" stroke="#4f5d75" stroke-width="1">
      <!-- Frame -> Implement (via right edge, clears the IMPLEMENTATION lane label) -->
      <path d="M 148 94 L 156 94 Q 164 94 164 102 L 164 176 Q 164 176 172 176 L 180 176" marker-end="url(#arrow)"/>
      <!-- Implement -> Tests (shared y, straight) -->
      <line x1="264" y1="176" x2="296" y2="176" marker-end="url(#arrow)"/>
      <!-- Tests -> Plan (attach x=436) -->
      <path d="M 338 152 L 338 135 Q 338 127 346 127 L 428 127 Q 436 127 436 119 L 436 120" marker-end="url(#arrow)"/>
      <!-- Plan (attach x=460) -> Review zone -->
      <path d="M 460 120 L 460 250 Q 460 250 468 250 L 532 250 Q 540 250 540 250" marker-end="url(#arrow)"/>
      <!-- Review zone -> Triage -->
      <path d="M 840 250 L 856 250 Q 864 250 864 242 L 864 108 Q 864 100 872 100" marker-end="url(#arrow)"/>
      <!-- Triage -> Fix (shared x, straight) -->
      <line x1="928" y1="124" x2="928" y2="152" marker-end="url(#arrow)"/>
      <!-- Fix -> Plan loop-back (dashed, attach x=912, loop x=484) -->
      <path d="M 912 200 L 912 654 L 484 654 L 484 120" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <!-- Fix -> Verify pass path (attach x=944) -->
      <path d="M 944 200 L 944 470 Q 944 470 952 470 L 1068 470 Q 1076 470 1076 478 L 1076 494" marker-end="url(#arrow)"/>
      <!-- Verify -> Walkthrough (shared x, straight) -->
      <line x1="1076" y1="546" x2="1076" y2="552" marker-end="url(#arrow)"/>
      <!-- Walkthrough -> PR (shared x, straight) -->
      <line x1="1076" y1="596" x2="1076" y2="602" marker-end="url(#arrow)"/>
    </g>
    <!-- Triage -> Escalate (dashed, accent) -->
    <line x1="984" y1="92" x2="1016" y2="92" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

    <!-- ===== arrow labels (masked) ===== -->
    <g>
      <rect fill="#f5f5f5" x="662" y="632" width="56" height="12" rx="2"/>
      <text class="arrow-lbl" x="690" y="641">LOOP &times;2</text>
      <rect fill="#f5f5f5" x="928" y="326" width="48" height="12" rx="2"/>
      <text class="arrow-lbl" x="952" y="335">PASS</text>
    </g>
    <g class="caption">
      <text x="644" y="618" text-anchor="middle">blocked: &gt;2 rounds, repeat concern, no progress, or needs redesign</text>
    </g>

    <!-- ===== nodes: Lead lane ===== -->
    <g>
      <rect class="box" x="64" y="70" width="84" height="48" rx="6"/>
      <text class="name-sm" x="106" y="92" text-anchor="middle">Frame</text>
      <text class="sub" x="106" y="106" text-anchor="middle">brief &middot; run dir</text>
    </g>
    <g>
      <rect class="box" x="412" y="64" width="96" height="56" rx="6"/>
      <text class="name-sm" x="460" y="86" text-anchor="middle">Plan round</text>
      <text class="sub" x="460" y="100" text-anchor="middle">classify + snapshot</text>
      <text class="gate" x="460" y="112" text-anchor="middle">tree (before): sha</text>
    </g>
    <g>
      <rect class="box" x="872" y="60" width="112" height="64" rx="6"/>
      <text class="name-sm" x="928" y="82" text-anchor="middle">Triage</text>
      <text class="sub" x="928" y="96" text-anchor="middle">evidence + cause</text>
      <text class="gate" x="928" y="110" text-anchor="middle">re-digest: tree (after)</text>
    </g>
    <g>
      <rect fill="#f5f5f5" x="1016" y="60" width="120" height="64" rx="6"/>
      <rect class="ext" x="1016" y="60" width="120" height="64" rx="6"/>
      <text class="name-sm" x="1076" y="80" text-anchor="middle">Escalate</text>
      <text class="sub" x="1076" y="93" text-anchor="middle">dev-loop (full)</text>
      <text class="gate-ext" x="1076" y="107" text-anchor="middle">critical in round 1</text>
    </g>

    <!-- ===== nodes: Implementation lane ===== -->
    <g>
      <rect class="box" x="180" y="152" width="84" height="48" rx="6"/>
      <text class="name-sm" x="222" y="174" text-anchor="middle">Implement</text>
      <text class="sub" x="222" y="188" text-anchor="middle">sidekick</text>
    </g>
    <g>
      <rect class="box" x="296" y="152" width="84" height="48" rx="6"/>
      <text class="name-sm" x="338" y="174" text-anchor="middle">Tests</text>
      <text class="sub" x="338" y="188" text-anchor="middle">sidekick</text>
    </g>
    <g>
      <rect class="box" x="872" y="152" width="112" height="48" rx="6"/>
      <text class="name-sm" x="928" y="174" text-anchor="middle">Fix</text>
      <text class="sub" x="928" y="188" text-anchor="middle">sidekick(-heavy)</text>
    </g>

    <!-- ===== nodes: Review lane — the four consolidated chips ===== -->
    <g>
      <rect class="chip" x="548" y="252" width="284" height="48" rx="4"/>
      <text class="name-sm" x="690" y="267" text-anchor="middle">Correctness</text>
      <text class="sub" x="690" y="278" text-anchor="middle">sonnet &middot; high</text>
      <text class="merge" x="690" y="288" text-anchor="middle">merges: requirements + technical + artifacts</text>
      <text class="gate" x="690" y="297" text-anchor="middle">always</text>

      <rect class="chip" x="548" y="308" width="284" height="48" rx="4"/>
      <text class="name-sm" x="690" y="323" text-anchor="middle">Structure</text>
      <text class="sub" x="690" y="334" text-anchor="middle">sonnet &middot; high</text>
      <text class="merge" x="690" y="344" text-anchor="middle">merges: architecture + standards + minimalism + dead code</text>
      <text class="gate" x="690" y="353" text-anchor="middle">always</text>

      <rect class="chip" x="548" y="364" width="284" height="48" rx="4"/>
      <text class="name-sm" x="690" y="379" text-anchor="middle">Tests</text>
      <text class="sub" x="690" y="390" text-anchor="middle">haiku &middot; high</text>
      <text class="merge" x="690" y="400" text-anchor="middle">merges: tests + validation sufficiency</text>
      <text class="gate" x="690" y="409" text-anchor="middle">always</text>

      <rect class="chip" x="548" y="420" width="284" height="48" rx="4"/>
      <text class="name-sm" x="690" y="435" text-anchor="middle">Security</text>
      <text class="sub" x="690" y="446" text-anchor="middle">sonnet &middot; high</text>
      <text class="merge" x="690" y="456" text-anchor="middle">not merged &mdash; kept whole</text>
      <text class="gate" x="690" y="465" text-anchor="middle">input/queries/IO/deps, not authn/secrets</text>
    </g>

    <!-- ===== nodes: Verify & Ship lane ===== -->
    <g>
      <rect class="box" x="1006" y="494" width="140" height="52" rx="6"/>
      <text class="name-sm" x="1076" y="508" text-anchor="middle">Verify</text>
      <text class="sub" x="1076" y="520" text-anchor="middle">opus &middot; high</text>
      <text class="gate" x="1076" y="531" text-anchor="middle">crit/major(bug) fixed,</text>
      <text class="gate" x="1076" y="540" text-anchor="middle">or artifacts changed</text>
    </g>
    <g>
      <rect class="box" x="1016" y="552" width="120" height="44" rx="6"/>
      <text class="name-sm" x="1076" y="568" text-anchor="middle">Walkthrough</text>
      <text class="sub" x="1076" y="581" text-anchor="middle">pr-walkthrough</text>
    </g>
    <g>
      <rect class="box" x="1016" y="602" width="120" height="44" rx="6"/>
      <text class="name-sm" x="1076" y="618" text-anchor="middle">Open PR</text>
      <text class="sub" x="1076" y="631" text-anchor="middle">target: source branch</text>
    </g>

    <!-- ===== legend ===== -->
    <line x1="40" y1="672" x2="1240" y2="672" stroke="rgba(45,49,66,0.14)" stroke-width="0.8"/>
    <g>
      <rect class="box" x="64" y="684" width="16" height="12" rx="2"/>
      <text class="legend-t" x="88" y="694">PROCESS STEP</text>

      <rect class="zone zone-focal" x="284" y="684" width="16" height="12" rx="2"/>
      <text class="legend-t" x="308" y="694">CONSOLIDATED LANES (FOCAL)</text>

      <rect class="ext" x="624" y="684" width="16" height="12" rx="2"/>
      <text class="legend-t" x="648" y="694">ESCALATION / LOOP-BACK</text>

      <rect class="tag-focal" x="924" y="684" width="16" height="12" rx="2"/>
      <text class="legend-t" x="948" y="694">COMPRESSION (FOCAL)</text>
    </g>
  </svg>
</div>
</body>
</html>
