<!DOCTYPE html>
<html lang="en">
<head>

  <title>The full dev loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #0b131b;   /* deep navy ground — one step below brand navy */
      --color-panel:   #1a2a38;   /* navy-80 — node fill */
      --color-ink:     #ffffff;
      --color-muted:   #c8ccd0;
      --color-soft:    #93989c;
      --color-accent:  #f05126;   /* full-strength Tecala orange */
      --font-sans:     'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1320px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.35rem;
    }

    .standfirst {
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--color-muted);
      max-width: 62ch;
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · dev-loop</p>
    <h1>The full dev loop</h1>
    <p class="standfirst">Nine gated lanes, one owner per concern, three rounds. Four Opus lanes and five Sonnet — the honest default for most work, and the 1× against which the other four loops are priced.</p>

        <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#93989c"/></marker>
      </defs>
