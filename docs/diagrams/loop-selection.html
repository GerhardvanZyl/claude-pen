<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>loop-selection · Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Choosing a loop — work down the ladder, escalate back up when evidence says so</h1>

    <svg viewBox="0 0 1280 1320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ls-title ls-desc">
      <title id="ls-title">Choosing a development loop</title>
      <desc id="ls-desc">Flowchart of the five-loop selection ladder — ultralight, lite, full, ultra, ultra-opus — each gated by a shortened eligibility question, with dev-loop shown as the accent default, a zoned single-player Unity branch choosing between dev-loop-unity-lite and dev-loop-unity, and every mandatory escalation drawn as a labelled back-arrow to a heavier loop.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" markerWidth="7" markerHeight="5.5" refX="6" refY="2.75" orient="auto"><polygon points="0 0, 7 2.75, 0 5.5" fill="#7a8399"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Zone: single-player Unity ===== -->
      <rect x="890" y="70" width="350" height="250" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>
      <text x="906" y="88" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ZONE — SINGLE-PLAYER UNITY</text>

      <!-- ===== Primary flow arrows ===== -->
      <line x1="620" y1="74" x2="620" y2="65" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="840" y1="160" x2="925" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="255" x2="620" y2="305" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="850" y1="420" x2="930" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="620" y1="535" x2="620" y2="550" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="520" y1="650" x2="580" y2="650" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="300" y1="750" x2="300" y2="780" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1070" y1="446" x2="1070" y2="470" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1070" y1="670" x2="1070" y2="740" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1070" y1="792" x2="1070" y2="815" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="1070" y1="1025" x2="1070" y2="1055" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M1065,215 L1065,219 Q1065,223 1057,223 L998,223 Q990,223 990,231 L990,245" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M1065,215 L1065,219 Q1065,223 1073,223 L1132,223 Q1140,223 1140,231 L1140,245" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== "No further" stop points ===== -->
      <circle cx="840" cy="570" r="4" fill="#2d3142"/>
      <line x1="860" y1="570" x2="844" y2="570" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-soft)"/>
      <rect x="672" y="567" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="828" y="574" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">no → stays at dev-loop (full)</text>

      <circle cx="840" cy="920" r="4" fill="#2d3142"/>
      <line x1="860" y1="920" x2="844" y2="920" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow-soft)"/>
      <rect x="672" y="907" width="156" height="12" rx="2" fill="#f5f5f5"/>
      <text x="828" y="914" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">no → stays at dev-loop-ultra</text>

      <!-- ===== Escalation back-arrows (labelled) ===== -->
      <!-- ultralight -> lite -->
      <path d="M680,676 L680,762 Q680,770 672,770 L288,770 Q280,770 280,778 L280,780" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <rect x="360" y="758" width="264" height="12" rx="2" fill="#f5f5f5"/>
      <text x="492" y="768" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OTHER MAJOR · &gt;4 ACCEPTED · COULDN'T COVER</text>

      <!-- ultralight -> full -->
      <path d="M680,624 L680,548 Q680,540 672,540 L28,540 Q20,540 20,532 L20,23 Q20,15 28,15 L857,15 Q865,15 865,23 L865,427 Q865,435 873,435 L930,435" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <rect x="24" y="500" width="230" height="12" rx="2" fill="#f5f5f5"/>
      <text x="139" y="510" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CRITICAL, OR MAJOR SEC/ARCH/CONCURRENCY</text>

      <!-- lite -> full -->
      <path d="M140,806 L64,806 Q56,806 56,798 L56,35 Q56,27 64,27 L849,27 Q857,27 857,35 L857,455 Q857,463 849,463 L930,463" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <rect x="60" y="580" width="150" height="12" rx="2" fill="#f5f5f5"/>
      <text x="135" y="590" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ANY CRITICAL IN ROUND 1</text>

      <!-- full -> ultra -->
      <path d="M950,446 L868,446 Q860,446 860,454 L860,758 Q860,766 868,766 L930,766" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="796" y="610" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">CRITICAL IN AN UNEXPECTED</text>
      <text x="796" y="622" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">LANE, OR RECURRING</text>

      <!-- ultra -> ultra-opus -->
      <path d="M950,792 L868,792 Q860,792 860,800 L860,1073 Q860,1081 868,1081 L930,1081" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <text x="796" y="932" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">COVERAGE BOTH THIN</text>
      <text x="796" y="944" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">ON A CRITICAL, TWICE</text>

      <!-- unity-lite -> unity -->
      <path d="M1055,269 L1075,269" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
      <rect x="950" y="298" width="230" height="20" rx="2" fill="#ececec"/>
      <text x="1065" y="308" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">CRITICAL IN ROUND 1, OR NEEDS</text>
      <text x="1065" y="317" fill="#7a8399" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">ART DIRECTION / SETTINGS / PRIMITIVE</text>

      <!-- unity zone -> general ladder (eligibility breaks mid-run) -->
      <path d="M890,270 L628,270 Q620,270 620,278 L620,301" fill="none" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="5,4" marker-end="url(#arrow-soft)"/>
      <rect x="630" y="264" width="190" height="12" rx="2" fill="#f5f5f5"/>
      <text x="725" y="274" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ELIGIBILITY BREAKS MID-RUN</text>

      <!-- ===== Annotation callout ===== -->
      <text x="1200" y="1140" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">when unsure, go heavier — the honest</text>
      <text x="1200" y="1158" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">default for most work is dev-loop</text>
      <path d="M1040,1146 Q1010,1110 1000,1085" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="1000" cy="1085" r="2" fill="#2d3142"/>

      <!-- yes/no tags on primary arrows (drawn after all connectors so masks stay opaque) -->
      <rect x="866" y="150" width="26" height="12" rx="2" fill="#f5f5f5"/>
      <text x="879" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="598" y="264" width="42" height="20" rx="2" fill="#f5f5f5"/>
      <text x="610" y="282" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="836" y="410" width="26" height="12" rx="2" fill="#f5f5f5"/>
      <text x="849" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="598" y="555" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="610" y="565" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="522" y="640" width="26" height="12" rx="2" fill="#f5f5f5"/>
      <text x="535" y="650" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="288" y="757" width="24" height="12" rx="2" fill="#f5f5f5"/>
      <text x="300" y="767" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>
      <rect x="1057" y="672" width="26" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1070" y="682" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="1057" y="1031" width="26" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1070" y="1041" font-family="'Geist Mono', monospace" fill="#4f5d75" font-size="8" text-anchor="middle">YES</text>
      <rect x="985" y="222" width="26" height="12" rx="2" fill="#ececec"/>
      <text x="998" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">YES</text>
      <rect x="1105" y="222" width="24" height="12" rx="2" fill="#ececec"/>
      <text x="1117" y="232" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NO</text>

      <!-- ===== Nodes ===== -->

      <!-- entry -->
      <rect x="470" y="30" width="300" height="44" rx="22" fill="#2d3142"/>
      <text x="620" y="57" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">a change to implement</text>

      <!-- D0 -->
      <polygon points="620,65 840,160 620,255 400,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="142" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SINGLE-PLAYER UNITY CHANGE?</text>
      <text x="620" y="158" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">no networking, multiplayer, accounts,</text>
      <text x="620" y="170" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">purchases, analytics, UGC, mods, credentials</text>

      <!-- UD1 -->
      <polygon points="1065,105 1205,160 1065,215 925,160" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1065" y="150" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CONTAINED?</text>
      <text x="1065" y="163" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">one system/scene, no settings/</text>
      <text x="1065" y="173" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle">pipeline/package/asmdef/primitive</text>

      <!-- unity-lite / unity -->
      <rect x="925" y="245" width="130" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="990" y="266" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop-</text>
      <text x="990" y="278" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">unity-lite</text>

      <rect x="1075" y="245" width="130" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1140" y="272" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop-unity</text>

      <!-- D1 -->
      <polygon points="620,305 850,420 620,535 390,420" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="620" y="398" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AUTH/SECRETS/UNTRUSTED INPUT ·</text>
      <text x="620" y="412" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MIGRATION/SCHEMA/CONTRACT ·</text>
      <text x="620" y="426" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">MORE THAN ONE PROJECT ·</text>
      <text x="620" y="440" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HARD TO ROLL BACK?</text>

      <!-- full (FOCAL) -->
      <rect x="930" y="394" width="280" height="52" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="1070" y="413" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop (full)</text>
      <text x="1070" y="428" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">the default · 9 gated lanes · 3 rounds</text>

      <!-- D2 -->
      <polygon points="300,550 520,650 300,750 80,650" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="300" y="638" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CONTAINED?</text>
      <text x="300" y="654" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">≤5 files, one project, no concurrency,</text>
      <text x="300" y="666" fill="#4f5d75" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle">no new dependency, easy rollback</text>

      <!-- ultralight / lite -->
      <rect x="580" y="624" width="260" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="710" y="644" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop-ultralight</text>
      <text x="710" y="659" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1 reviewer, 9-item sweep</text>

      <rect x="140" y="780" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="280" y="800" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop-lite</text>
      <text x="280" y="815" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">4 consolidated lanes</text>

      <!-- D3 -->
      <polygon points="1070,470 1260,570 1070,670 880,570" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1070" y="548" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EXPENSIVE TO MISS?</text>
      <text x="1070" y="563" fill="#4f5d75" font-size="7.2" font-family="'Geist Mono', monospace" text-anchor="middle">money/goods · tenant isolation ·</text>
      <text x="1070" y="575" fill="#4f5d75" font-size="7.2" font-family="'Geist Mono', monospace" text-anchor="middle">destructive migration · a contract</text>
      <text x="1070" y="587" fill="#4f5d75" font-size="7.2" font-family="'Geist Mono', monospace" text-anchor="middle">others build on · code you won't maintain</text>

      <!-- ultra -->
      <rect x="930" y="740" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1070" y="760" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop-ultra</text>
      <text x="1070" y="775" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">9 adversarial triples · 3 rounds</text>

      <!-- D4 -->
      <polygon points="1070,815 1260,920 1070,1025 880,920" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1070" y="895" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SEVERE AND LARGELY</text>
      <text x="1070" y="909" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">IRREVERSIBLE?</text>
      <text x="1070" y="925" fill="#4f5d75" font-size="7.2" font-family="'Geist Mono', monospace" text-anchor="middle">destroys prod data · exposes other</text>
      <text x="1070" y="937" fill="#4f5d75" font-size="7.2" font-family="'Geist Mono', monospace" text-anchor="middle">tenants' data · regulatory consequence</text>

      <!-- opus -->
      <rect x="930" y="1055" width="280" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="1070" y="1075" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dev-loop-ultra-opus</text>
      <text x="1070" y="1090" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">every reviewer on opus · ~8×</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="1220" x2="1240" y2="1220" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="1236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="1250" width="14" height="14" rx="7" fill="#2d3142"/>
      <text x="64" y="1261" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entry</text>

      <polygon points="150,1250 164,1257 150,1264 136,1257" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="174" y="1261" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision</text>

      <rect x="270" y="1250" width="20" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="298" y="1261" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Loop</text>

      <rect x="380" y="1250" width="20" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="408" y="1261" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal — the default</text>

      <line x1="570" y1="1257" x2="600" y2="1257" stroke="#7a8399" stroke-width="1.1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
      <text x="608" y="1261" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escalation (labelled back-arrow)</text>

      <circle cx="880" cy="1257" r="4" fill="#2d3142"/>
      <text x="898" y="1261" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">No further escalation</text>
    </svg>
  </div>
</body>
</html>
