<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dev-loop-ultralight · Diagram Design</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Swimlane · Diagram Design</p>
    <h1>dev-loop-ultralight — one reviewer, one round, no verification</h1>

    <svg viewBox="0 0 1280 1160" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dlu-title dlu-desc">
      <title id="dlu-title">dev-loop-ultralight phase flow</title>
      <desc id="dlu-desc">Swimlane diagram of the dev-loop-ultralight skill: the lead checks a six-point eligibility list, hands one combined implement-and-test brief to a sidekick, a single reviewer sweeps nine concerns in one pass, the lead triages and fixes, skips verification, checks the walkthrough inline, and opens the pull request — with escalation branches to dev-loop-lite and the full dev-loop at three decision points.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lane structure (zones) -->
      <line x1="40" y1="56" x2="1240" y2="56" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <line x1="430" y1="56" x2="430" y2="1050" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
      <line x1="730" y1="56" x2="730" y2="1050" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
      <line x1="40" y1="1050" x2="1240" y2="1050" stroke="rgba(45,49,66,0.14)" stroke-width="1"/>
      <text x="40" y="48" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">LEAD</text>
      <text x="440" y="48" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">IMPLEMENTATION · SIDEKICK</text>
      <text x="740" y="48" fill="#4f5d75" font-size="9" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.16em">REVIEW · REVIEWER-ULTRALIGHT</text>

      <!-- ===== Arrows (drawn before nodes) ===== -->
      <line x1="230" y1="96"  x2="230" y2="116" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="180" x2="440" y2="180" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="240" x2="740" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="230" y1="266" x2="230" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="332" x2="440" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="720" y1="340" x2="740" y2="340" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="990" y1="400" x2="990" y2="424" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M740,392 L418,392 Q410,392 410,400 L410,424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="460" x2="440" y2="460" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="560" x2="440" y2="560" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M230,604 L230,616 Q230,624 238,624 L440,624" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <path d="M580,710 L580,712 Q580,720 572,720 L238,720 Q230,720 230,728 L230,730" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="420" y1="760" x2="740" y2="760" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="230" y1="790" x2="230" y2="800" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="230" y1="876" x2="230" y2="910" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="230" y1="990" x2="230" y2="1010" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Annotation callout ===== -->
      <text x="1200" y="650" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">no verification phase — anything risky enough</text>
      <text x="1200" y="668" fill="#2d3142" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">to warrant one has already escalated</text>
      <path d="M1045,656 Q900,700 736,743" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="736" cy="743" r="2" fill="#2d3142"/>

      <!-- ===== Nodes ===== -->

      <!-- Entry -->
      <rect x="130" y="68" width="200" height="28" rx="14" fill="#2d3142"/>
      <text x="230" y="86" fill="#f5f5f5" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/dev-loop-ultralight</text>

      <!-- Eligibility (FOCAL 1/2) -->
      <rect x="40" y="116" width="380" height="150" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="52" y="132" fill="#eb6c36" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.10em">ELIGIBILITY — CHECKED FIRST, ALL MUST HOLD</text>
      <text x="52" y="148" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1 one project, ≤5 files</text>
      <text x="52" y="162" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">2 no authn/authz, secrets, untrusted input</text>
      <text x="52" y="176" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3 no migration, schema, artifact, contract</text>
      <text x="52" y="190" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">4 no concurrency / transaction-boundary change</text>
      <text x="52" y="204" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">5 no new dependency</text>
      <text x="52" y="218" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">6 easy to roll back</text>
      <text x="52" y="238" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-style="italic">the entire safety mechanism of this loop —</text>
      <text x="52" y="250" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-style="italic">nothing downstream catches a bad admission</text>

      <!-- Eligibility escalation chips -->
      <rect x="440" y="170" width="280" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="580" y="192" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ANY ONE FAILS</text>
      <text x="580" y="210" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ dev-loop-lite</text>

      <rect x="740" y="210" width="500" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="990" y="232" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SEVERAL FAIL, OR YOU ARE UNSURE</text>
      <text x="990" y="250" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ dev-loop (full)</text>

      <!-- Phase 0 -->
      <rect x="40" y="296" width="380" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="52" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 0 — FRAME</text>
      <text x="52" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">lead</text>
      <text x="52" y="342" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">brief.md + notes.md in runs/&lt;run-id&gt;/ · source branch</text>
      <text x="52" y="356" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">records which eligibility criterion chose this loop</text>

      <!-- Phase 1 -->
      <rect x="440" y="296" width="280" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="452" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 1 — IMPLEMENT &amp; TEST</text>
      <text x="452" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">sidekick · single handoff</text>
      <text x="452" y="342" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">one brief covers impl AND tests —</text>
      <text x="452" y="354" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">unlike every other loop</text>
      <text x="452" y="370" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">asks for rejected alternatives → notes.md</text>

      <!-- Phase 2 -->
      <rect x="740" y="296" width="500" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="752" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 2 — REVIEW</text>
      <text x="752" y="326" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">reviewer-ultralight · sonnet · high</text>
      <text x="752" y="344" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">snapshot the tree first (round-1/plan.md: tree:&lt;sha&gt;)</text>
      <text x="752" y="358" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">spawned ONCE, read-only — no scratch worktree here</text>
      <text x="752" y="372" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">writes round-1/ultralight.json + .log.md</text>
      <text x="752" y="386" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">returns: path, counts, items covered / 9</text>

      <!-- Sweep (FOCAL 2/2) -->
      <rect x="740" y="424" width="500" height="170" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="752" y="440" fill="#eb6c36" font-size="8" font-weight="500" font-family="'Geist Mono', monospace" letter-spacing="0.08em">THE SWEEP — EVERY ITEM, IN ORDER, EVERY TIME</text>
      <text x="752" y="456" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">1 REQUIREMENTS — brief asked, and nothing more</text>
      <text x="752" y="470" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">2 CORRECTNESS — logic, boundaries, the 2nd call</text>
      <text x="752" y="484" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">3 ERROR PATHS — throws, timeout, partial result</text>
      <text x="752" y="498" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">4 SEPARATION OF CONCERNS — do not compress this one</text>
      <text x="752" y="512" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">5 PLACEMENT — repo convention; inferred never blocks</text>
      <text x="752" y="526" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">6 STANDARDS — coding-standards skill + standards.md</text>
      <text x="752" y="540" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">7 SECURITY — authz/untrusted input here = wrong loop</text>
      <text x="752" y="554" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">8 TESTS — would it fail if the code were wrong?</text>
      <text x="752" y="568" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">9 SURPLUS — guards, wrappers, config nothing requires</text>
      <text x="752" y="584" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-style="italic">verdict on all nine, incl. items that found nothing</text>

      <!-- Phase 3 -->
      <rect x="40" y="424" width="380" height="180" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="52" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 3 — TRIAGE</text>
      <text x="52" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">lead is the arbiter</text>
      <text x="52" y="472" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">re-snapshot &amp; compare first — moved?</text>
      <text x="52" y="484" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">restore the tree and rerun that lane</text>
      <text x="52" y="502" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">evidence gate — inferred alone never blocks</text>
      <text x="52" y="516" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">cause gate — introduced/worsened/missing-required</text>
      <text x="52" y="528" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">fixed; stale recorded, not fixed</text>
      <text x="52" y="546" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">defect ≠ remedy · wontfix.json dies with the run</text>
      <text x="52" y="560" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">conventions.md survives to the next run</text>
      <text x="52" y="578" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" font-style="italic">requirements findings → notes.md either way</text>

      <!-- Triage escalation chips -->
      <rect x="440" y="454" width="280" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="580" y="474" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CRITICAL, OR MAJOR IN</text>
      <text x="580" y="486" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SECURITY / ARCH / CONCURRENCY</text>
      <text x="580" y="502" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ dev-loop (full)</text>

      <rect x="440" y="534" width="280" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="580" y="554" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">OTHER MAJOR · &gt;4 ACCEPTED ·</text>
      <text x="580" y="566" fill="#2d3142" font-size="9" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REVIEWER COULDN'T COVER</text>
      <text x="580" y="582" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ dev-loop-lite</text>

      <!-- Phase 4 -->
      <rect x="440" y="620" width="280" height="90" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="452" y="636" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 4 — FIX</text>
      <text x="452" y="650" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">sidekick · reviewers never edit</text>
      <text x="452" y="666" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">would_have_been_bug: write the failing test</text>
      <text x="452" y="678" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">FIRST, confirm it fails, then fix, then pass</text>
      <text x="452" y="694" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">then run the relevant tests, lint, build</text>

      <!-- Phase 5 -->
      <rect x="40" y="730" width="380" height="60" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="52" y="750" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 5 — EXIT</text>
      <text x="52" y="766" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">did the fixes clear it? no second round either way</text>

      <!-- Exit escalation chip -->
      <rect x="740" y="730" width="500" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="990" y="750" fill="#2d3142" font-size="9.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">NO, OR THE FIX INTRODUCED SOMETHING NEW</text>
      <text x="990" y="768" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ dev-loop-lite — one reviewer cannot mark its own work twice</text>

      <!-- Phase 5b -->
      <rect x="40" y="800" width="380" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="52" y="816" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 5b — WALKTHROUGH</text>
      <text x="52" y="830" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">lead checks it inline — no pr-walkthrough-review</text>
      <text x="52" y="846" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">sidekick drafts it from notes.md, not the diff</text>
      <text x="52" y="860" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">re-snapshot becomes the Phase 6 baseline</text>

      <!-- Phase 6 -->
      <rect x="40" y="910" width="380" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="52" y="926" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">PHASE 6 — COMMIT, PUSH, PR</text>
      <text x="52" y="940" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">lead</text>
      <text x="52" y="956" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">stage untracked (??) too · verify diff matches the</text>
      <text x="52" y="968" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">sweep and the tree digest, by content not filename</text>
      <text x="52" y="982" fill="#2d3142" font-size="8.5" font-family="'Geist Mono', monospace">PR targets the Phase 0 source branch, states one pass</text>

      <!-- Done -->
      <rect x="130" y="1010" width="200" height="28" rx="14" fill="#2d3142"/>
      <text x="230" y="1028" fill="#f5f5f5" font-size="10.5" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PR opened</text>

      <!-- Legend -->
      <line x1="40" y1="1058" x2="1240" y2="1058" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="1074" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="1088" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="60" y="1096" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Process step</text>

      <rect x="180" y="1088" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="200" y="1096" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal — eligibility &amp; the sweep</text>

      <rect x="430" y="1088" width="14" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="450" y="1096" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Escalation target</text>

      <rect x="620" y="1086" width="14" height="14" rx="7" fill="#2d3142"/>
      <text x="644" y="1096" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Entry / exit</text>
    </svg>
  </div>
</body>
</html>
