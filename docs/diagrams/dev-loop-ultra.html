    <h1>dev-loop-ultra — the adversarial review loop</h1>
    <p class="sub">Nine review lanes, each run as an opposed prosecution/defence pair reconciled by an adjudicator who never invents a finding neither reviewer raised. Same phases and tiers as dev-loop; roughly three times the review cost.</p>
